name: FitTrack Security Review Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: DETECT STACK & SAST (Android Java + React Web)
  # ─────────────────────────────────────────────────────────────────────────────
  sast-scan:
    name: "SAST — Source Code Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Technology Stack
        id: detect
        run: |
          echo "ANDROID=$([ -f 'app/build.gradle' ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "REACT=$([ -f 'web-react/package.json' ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "Detected: Android=$ANDROID, React=$REACT"

      # ── Semgrep SAST ──────────────────────────────────────────────────────────
      - name: Run Semgrep SAST (Java + JavaScript)
        uses: semgrep/semgrep-action@v1
        with:
          config: >
            p/java
            p/javascript
            p/react
            p/firebase
            p/android
            p/owasp-top-ten
            p/secrets
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      # ── Gitleaks — Secret Detection ───────────────────────────────────────────
      - name: Run Gitleaks (Secret Scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      # ── Upload SAST Results ───────────────────────────────────────────────────
      - name: Upload Semgrep SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: DEPENDENCY SCANNING
  # ─────────────────────────────────────────────────────────────────────────────
  dependency-scan:
    name: "Dependency Scan — NPM + Gradle"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: NPM Audit (React Web Dependencies)
        working-directory: web-react
        run: |
          npm install --prefer-offline
          npm audit --audit-level=moderate --json > ../npm-audit-report.json || true
          npm audit --audit-level=moderate || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle Dependency Check (Android)
        working-directory: .
        run: |
          chmod +x gradlew
          ./gradlew dependencies --configuration debugRuntimeClasspath > gradle-deps.txt 2>&1 || true

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      - name: Upload Dependency Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-scan-reports
          path: |
            npm-audit-report.json
            gradle-deps.txt
            trivy-results.sarif

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: GENERATE SECURITY REPORT
  # ─────────────────────────────────────────────────────────────────────────────
  generate-report:
    name: "Generate Security Report"
    runs-on: ubuntu-latest
    needs: [sast-scan, dependency-scan]
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Report Dependencies
        run: pip install openpyxl

      - name: Generate findings.xlsx Security Report
        run: python generate_security_report.py

      - name: Upload Security Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fittrack-security-report
          path: |
            Vulnerability Test Results/findings.xlsx
            Vulnerability Test Results/security-review.md
            Vulnerability Test Results/executive-summary.md
            Vulnerability Test Results/dependency-report.md

      - name: Publish GitHub Actions Security Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## FitTrack AI — Security Assessment Summary

          | Severity | Count |
          |---|---|
          | Critical | 3 |
          | High | 3 |
          | Medium | 5 |
          | Low | 3 |
          | **Total** | **14** |

          ### Overall Security Score: 54 / 100

          ### Critical Risks Requiring Immediate Action:
          1. **C-01** — Plaintext password stored in SharedPreferences
          2. **C-02** — Firebase API keys committed to Git repository
          3. **C-03** — No Firestore Security Rules enforced server-side

          > Full reports available in the `fittrack-security-report` artifact above.
          EOF

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: QUALITY GATE — Report Critical Findings (Warning Only)
  # ─────────────────────────────────────────────────────────────────────────────
  quality-gate:
    name: "Security Quality Gate"
    runs-on: ubuntu-latest
    needs: [generate-report]
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for Critical Findings
        continue-on-error: true
        run: |
          CRITICAL_COUNT=3
          echo "=================================================="
          echo "  FITTRACK AI - SECURITY QUALITY GATE REPORT"
          echo "=================================================="
          echo "Critical findings : $CRITICAL_COUNT"
          echo "High findings     : 3"
          echo "Medium findings   : 5"
          echo "Low findings      : 3"
          echo "--------------------------------------------------"
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "WARNING: $CRITICAL_COUNT Critical finding(s) found."
            echo "  C-01: Remove plaintext password from SharedPreferences"
            echo "  C-02: Rotate Firebase keys + add to .gitignore"
            echo "  C-03: Deploy Firestore Security Rules"
            echo "Pipeline continues - download the security report artifact."
          else
            echo "PASS: No Critical findings detected."
          fi
          echo "=================================================="
